<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucas · 當日工作時間表</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/noto-sans-tc@latest/index.css">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  [hidden]{ display:none !important; }
  :root{
    --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; --card:#ffffff; --soft:#f8fafc;
    --shadow:0 10px 30px rgba(15,23,42,.07);
    --bggrad:linear-gradient(150deg,#eef2ff 0%,#f8fafc 45%,#ecfeff 100%);
    --patrol:#10b981; --patrol-soft:#d1fae5; --patrol-ink:#047857;
    --p2:#3b82f6; --p2-soft:#dbeafe; --p2-ink:#1d4ed8;
    --p3:#8b5cf6; --p3-soft:#ede9fe; --p3-ink:#6d28d9;
    --p5:#06b6d4; --p5-soft:#cffafe; --p5-ink:#0e7490;
    --meal:#f59e0b; --meal-soft:#fef3c7; --meal-ink:#b45309;
  }
  body[data-theme="dark"]{
    --ink:#e6edf7; --sub:#8fa3bf; --line:#233150; --card:#111a2e; --soft:#0d1526;
    --shadow:0 12px 32px rgba(0,0,0,.45);
    --bggrad:linear-gradient(150deg,#0b1020 0%,#0f172a 50%,#06222b 100%);
    --patrol-soft:rgba(16,185,129,.16);  --patrol-ink:#6ee7b7;
    --p2-soft:rgba(59,130,246,.16);      --p2-ink:#93c5fd;
    --p3-soft:rgba(139,92,246,.16);      --p3-ink:#c4b5fd;
    --p5-soft:rgba(6,182,212,.16);       --p5-ink:#67e8f9;
    --meal-soft:rgba(245,158,11,.16);    --meal-ink:#fcd34d;
    color-scheme:dark;
  }
  body{
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    color:var(--ink); background:var(--bggrad); min-height:100vh;
    transition:background .4s ease, color .4s ease;
  }
  .page{ max-width:980px; margin:0 auto; padding:36px 20px 70px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);
    transition:background .4s ease, border-color .4s ease; }

  /* ================= 頂部人物卡 ================= */
  .hero{ position:relative; overflow:hidden; display:flex; align-items:center; gap:22px; padding:30px 32px; flex-wrap:wrap; }
  .hero::before{ content:""; position:absolute; inset:0 0 auto 0; height:6px;
    background:linear-gradient(90deg,var(--p2),var(--p5),var(--patrol)); }
  .blob{ position:absolute; border-radius:50%; filter:blur(46px); opacity:.35; pointer-events:none; }
  .blob.b1{ width:220px; height:220px; right:-60px; top:-80px; background:#60a5fa; }
  .blob.b2{ width:180px; height:180px; right:120px; bottom:-90px; background:#34d399; }
  .avatar-img{ width:92px; height:92px; border-radius:26px; object-fit:cover; flex:none;
    box-shadow:0 10px 24px rgba(30,64,175,.28); border:2px solid var(--line); }
  .hero-info{ flex:1; min-width:250px; }
  .hero-top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  h1{ font-size:30px; letter-spacing:.5px; }
  .role{ background:var(--ink); color:var(--card); font-size:12px; padding:4px 12px; border-radius:999px; }
  .pill{ font-size:12px; font-weight:800; padding:5px 13px; border-radius:999px; }
  .pill.on{ background:var(--patrol-soft); color:var(--patrol-ink); }
  .pill.wait{ background:var(--p2-soft); color:var(--p2-ink); }
  .pill.off{ background:var(--line); color:var(--sub); }
  .clock{ display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums;
    background:var(--soft); border:1px solid var(--line); border-radius:999px;
    padding:6px 14px; font-size:14px; font-weight:700; }
  .clock i{ width:8px; height:8px; border-radius:50%; background:#22c55e; animation:blink 1.2s infinite; }
  .clock em{ font-style:normal; font-size:11px; color:var(--meal-ink); background:var(--meal-soft);
    padding:2px 8px; border-radius:999px; }
  @keyframes blink{ 50%{ opacity:.25; } }
  .sub{ color:var(--sub); margin-top:6px; font-size:14px; }
  .sub b{ color:var(--ink); }
  .chips{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .chip{ font-size:12px; padding:5px 12px; border-radius:999px; font-weight:600; }
  .chip.c-patrol{ background:var(--patrol-soft); color:var(--patrol-ink); }
  .chip.c-meal{ background:var(--meal-soft); color:var(--meal-ink); }
  .chip.c-p2{ background:var(--p2-soft); color:var(--p2-ink); }
  .sp{ display:flex; align-items:center; gap:12px; margin-top:16px; }
  .sp-track{ flex:1; height:8px; border-radius:99px; background:var(--line); overflow:hidden; }
  .sp-fill{ height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,var(--p2),var(--patrol)); transition:width .6s ease; }
  #spTxt{ font-size:12px; color:var(--sub); font-weight:700; flex:none; font-variant-numeric:tabular-nums; }
  .hero-actions{ display:flex; flex-direction:column; gap:10px; margin-left:auto; }
  .btn-print,.btn-icon{ cursor:pointer; font-family:inherit; border:1px solid var(--line);
    background:var(--ink); color:var(--card); font-size:14px; font-weight:600;
    padding:11px 20px; border-radius:14px; transition:.25s;
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-icon{ width:44px; height:44px; padding:0; background:var(--card); color:var(--ink); }
  .btn-print:hover,.btn-icon:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(15,23,42,.22); }

  /* ================= 當前任務卡 ================= */
  .now-card{ display:flex; align-items:center; gap:20px; padding:22px 28px; margin-top:18px;
    flex-wrap:wrap; position:relative; overflow:hidden; }
  .now-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--nc,#94a3b8); }
  .now-dot{ width:16px; height:16px; border-radius:50%; background:var(--nc,#94a3b8); flex:none;
    animation:nowPulse 2s infinite; }
  @keyframes nowPulse{ 0%{ box-shadow:0 0 0 0 var(--ncs,rgba(148,163,184,.4)); } 100%{ box-shadow:0 0 0 14px transparent; } }
  .now-info{ flex:1; min-width:230px; }
  .now-info small{ color:var(--sub); font-size:12px; letter-spacing:1px; }
  .now-title{ font-size:21px; font-weight:800; margin-top:2px; }
  .now-range{ color:var(--sub); font-size:13px; font-weight:600; margin-left:10px; }
  .now-sub{ font-size:12.5px; color:var(--sub); margin-top:5px; }
  .ring-wrap{ position:relative; width:82px; height:82px; flex:none; }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--line); stroke-width:6; }
  .ring-fg{ fill:none; stroke-width:6; stroke-linecap:round;
    stroke-dasharray:163.36; stroke-dashoffset:163.36; transition:stroke-dashoffset .8s ease, stroke .4s; }
  .ring-txt{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-txt b{ font-size:21px; font-variant-numeric:tabular-nums; }
  .ring-txt span{ font-size:10px; color:var(--sub); }
  .now-tools{ display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .tool-row{ display:flex; gap:12px; align-items:center; }
  .btn-locate{ cursor:pointer; font-family:inherit; font-size:13px; font-weight:600;
    background:var(--card); color:var(--ink); border:1px solid var(--line);
    padding:8px 16px; border-radius:12px; transition:.2s; }
  .btn-locate:hover{ transform:translateY(-1px); box-shadow:0 6px 14px rgba(15,23,42,.12); }
  .auto{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--sub); user-select:none; }
  .sim{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub); user-select:none; }
  #simPanel{ display:flex; flex-direction:column; gap:8px; }
  #simRange{ width:220px; accent-color:var(--p2); }
  .sim-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .sim-btns button{ cursor:pointer; font-family:inherit; font-size:11.5px; padding:5px 10px; border-radius:9px;
    border:1px solid var(--line); background:var(--soft); color:var(--sub); transition:.2s; }
  .sim-btns button:hover{ color:var(--ink); transform:translateY(-1px); }

  /* ================= 統計卡 ================= */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:18px 0; }
  .stat{ padding:18px 20px; border-radius:18px; background:var(--card); border:1px solid var(--line);
    box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .stat::after{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--sc,#3b82f6); }
  .stat small{ color:var(--sub); font-size:12px; display:block; margin-bottom:6px; }
  .stat .num{ font-size:28px; font-weight:800; line-height:1; }
  .stat .unit{ font-size:13px; color:var(--sub); margin-left:4px; font-weight:600; }
  .stat .note{ font-size:12px; color:var(--sub); margin-top:6px; }

  /* ================= 區塊 ================= */
  .sec{ padding:26px 30px 30px; margin-top:18px; }
  h2{ font-size:18px; display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  h2::before{ content:""; width:5px; height:20px; border-radius:3px;
    background:linear-gradient(180deg,var(--p2),var(--patrol)); }

  /* ================= 甘特圖 ================= */
  .gantt-wrap{ padding-top:44px; }
  .gantt{ display:grid; grid-template-columns:repeat(24,1fr); position:relative; }
  .seg{ height:58px; margin:0 2px; border-radius:11px; position:relative; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:15px; letter-spacing:.5px;
    text-shadow:0 1px 2px rgba(0,0,0,.18);
    animation:grow .55s cubic-bezier(.2,.7,.3,1) backwards; animation-delay:var(--d,0s);
    transition:transform .2s, opacity .3s, filter .3s; }
  .seg:hover{ transform:translateY(-3px); }
  @keyframes grow{ from{ transform:scaleX(0); opacity:0; } }
  .seg .tip{ position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%) translateY(4px);
    background:var(--ink); color:var(--card); font-size:12px; font-weight:600;
    padding:8px 12px; border-radius:10px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:.2s; z-index:6; }
  .seg .tip::after{ content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:5px solid transparent; border-top-color:var(--ink); }
  .seg:hover .tip{ opacity:1; transform:translateX(-50%) translateY(0); }
  .gantt.filtered .seg{ opacity:.22; filter:grayscale(.6); }
  .gantt.filtered .seg.on{ opacity:1; filter:none; }
  .seg.past{ opacity:.4; filter:saturate(.55); }
  .seg.live{ opacity:1; filter:none; z-index:2; animation:grow .55s backwards, livePulse 1.8s infinite; }
  @keyframes livePulse{ 0%{ box-shadow:0 0 0 0 var(--glow,rgba(59,130,246,.45)); } 100%{ box-shadow:0 0 0 14px transparent; } }
  .now-line{ position:absolute; top:-8px; bottom:-8px; width:2px; background:#ef4444; z-index:4; pointer-events:none; }
  .now-line::before{ content:""; position:absolute; top:-5px; left:50%; transform:translateX(-50%);
    width:10px; height:10px; border-radius:50%; background:#ef4444; box-shadow:0 0 0 4px rgba(239,68,68,.25); }
  .now-line i{ position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    font-style:normal; font-size:11px; font-weight:800; color:#ef4444; font-variant-numeric:tabular-nums; }
  .scale{ position:relative; height:20px; margin-top:10px; color:var(--sub); font-size:12px; }
  .scale i{ position:absolute; top:0; font-style:normal; transform:translateX(-50%); }
  .scale i:first-child{ transform:none; }
  .scale i:last-child{ transform:translateX(-100%); }
  .legend{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .lg{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--sub);
    border:1px solid var(--line); border-radius:999px; padding:6px 13px; cursor:pointer;
    transition:.2s; background:var(--soft); user-select:none; }
  .lg:hover{ transform:translateY(-1px); box-shadow:0 4px 10px rgba(15,23,42,.08); }
  .lg.active{ background:var(--ink); color:var(--card); border-color:var(--ink); }
  .lg .dotc{ width:10px; height:10px; border-radius:50%; flex:none; }

  /* ================= 時間軸 ================= */
  .tl{ list-style:none; }
  .t-item{ display:grid; grid-template-columns:96px 26px 1fr; gap:0 14px; }
  .t-time{ text-align:right; padding-top:14px; font-variant-numeric:tabular-nums; }
  .t-time .st{ font-weight:800; font-size:16px; }
  .t-time .en{ color:var(--sub); font-size:12.5px; margin-top:2px; }
  .t-rail{ position:relative; }
  .t-rail::before{ content:""; position:absolute; left:50%; top:6px; bottom:-6px; width:2px;
    background:var(--line); transform:translateX(-50%); }
  .t-item:last-child .t-rail::before{ bottom:auto; height:26px; }
  .t-rail::after{ content:""; position:absolute; left:50%; top:20px; width:12px; height:12px;
    border-radius:50%; background:var(--c); transform:translateX(-50%); box-shadow:0 0 0 4px var(--cs); }
  .t-body{ display:flex; align-items:center; gap:14px; margin:6px 0 14px;
    background:var(--soft); border:1px solid var(--line); border-radius:15px; padding:13px 18px; transition:.25s; }
  .t-body:hover{ background:var(--card); border-color:var(--c); transform:translateX(5px);
    box-shadow:0 8px 20px rgba(15,23,42,.08); }
  .code{ width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center;
    background:var(--cs); color:var(--c); font-weight:800; font-size:17px; }
  .t-name{ font-weight:700; font-size:15px; }
  .t-tag{ font-size:11.5px; color:var(--c); background:var(--cs); padding:3px 9px; border-radius:999px;
    font-weight:600; margin-left:10px; }
  .dur{ margin-left:auto; color:var(--sub); font-size:12.5px; flex:none; }
  .state{ flex:none; font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:999px;
    background:var(--line); color:var(--sub); }
  .t-item.past .t-body{ opacity:.55; }
  .t-item.past .t-rail::after{ background:#94a3b8; box-shadow:none; }
  .t-item.live .t-body{ background:linear-gradient(0deg,var(--cs),var(--card));
    border-color:var(--c); box-shadow:0 8px 24px var(--cs); }
  .t-item.live .t-rail::after{ animation:dotPulse 1.6s infinite; }
  @keyframes dotPulse{ 0%{ box-shadow:0 0 0 4px var(--cs); } 100%{ box-shadow:0 0 0 12px transparent; } }
  .t-item.live .state{ background:var(--c); color:#fff; }
  .t-item.live .t-time .st{ color:var(--c); }
  .t-body.flash{ animation:flash .9s; }
  @keyframes flash{ 0%{ box-shadow:0 0 0 0 rgba(59,130,246,.45); } 100%{ box-shadow:0 0 0 16px rgba(59,130,246,0); } }

  footer{ text-align:center; color:var(--sub); font-size:12.5px; margin-top:26px; }

  /* ================= Toast ================= */
  .toast{ position:fixed; left:50%; bottom:26px; transform:translate(-50%,90px);
    background:var(--ink); color:var(--card); padding:12px 22px; border-radius:14px;
    font-weight:700; font-size:14px; box-shadow:0 12px 30px rgba(0,0,0,.3);
    transition:transform .45s cubic-bezier(.2,.7,.3,1); z-index:50;
    display:flex; gap:10px; align-items:center; max-width:92vw; }
  .toast.show{ transform:translate(-50%,0); }
  .toast .tdot{ width:10px; height:10px; border-radius:50%; flex:none; }

  .reveal{ opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease; }
  .reveal.in{ opacity:1; transform:none; }

  @media (max-width:720px){
    .stats{ grid-template-columns:repeat(2,1fr); }
    .hero-actions{ flex-direction:row; margin-left:0; }
    .t-item{ grid-template-columns:70px 22px 1fr; }
    .t-time .st{ font-size:14px; }
    .seg{ height:46px; font-size:13px; }
    .hero{ padding:26px 22px; }
    .sec{ padding:22px 18px 24px; }
    .now-tools{ align-items:flex-start; }
  }
  @media print{
    body{ background:#fff; }
    .hero-actions,.now-tools,.toast{ display:none !important; }
    .card,.stat{ box-shadow:none; }
    .reveal{ opacity:1; transform:none; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- 人物卡 -->
  <header class="card hero reveal in">
    <div class="blob b1"></div><div class="blob b2"></div>
    <img class="avatar-img" src="https://image.qwenlm.ai/public_source/295bb3e6-f411-4e58-a44a-c1d72dd93c26/17df280e4-4b2a-4d12-8eab-92780c5356b8.png" alt="Lucas 頭像">
    <div class="hero-info">
      <div class="hero-top">
        <h1>Lucas</h1><span class="role">保安 Guard</span>
        <span class="pill wait" id="statusPill">載入中</span>
        <span class="clock"><i></i><span id="clockTxt">--:--:--</span><em id="clockTag" hidden>模擬</em></span>
      </div>
      <p class="sub">當日值勤 <b>0800 – 2000</b> ・ 全日 12 小時</p>
      <div class="chips">
        <span class="chip c-p2">主責崗位 2・地下停車場閘口</span>
        <span class="chip c-patrol">巡邏 2 次（D・A）</span>
        <span class="chip c-meal">用膳 1300–1400</span>
      </div>
      <div class="sp"><div class="sp-track"><div class="sp-fill" id="spFill"></div></div><span id="spTxt">更進度 0%</span></div>
    </div>
    <div class="hero-actions">
      <button class="btn-icon" id="btnTheme" title="切換深色／淺色模式"></button>
      <button class="btn-print" onclick="window.print()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
        列印
      </button>
    </div>
  </header>

  <!-- 當前任務 -->
  <section class="card now-card reveal" id="nowCard">
    <span class="now-dot"></span>
    <div class="now-info">
      <small id="nowLabel">當前任務</small>
      <div class="now-title"><span id="nowTitle">—</span><span class="now-range" id="nowRange"></span></div>
      <div class="now-sub" id="nowNext"></div>
    </div>
    <div class="ring-wrap">
      <svg viewBox="0 0 64 64"><circle class="ring-bg" cx="32" cy="32" r="26"/><circle class="ring-fg" id="ringFg" cx="32" cy="32" r="26"/></svg>
      <div class="ring-txt"><b id="ringMin">–</b><span>剩餘分鐘</span></div>
    </div>
    <div class="now-tools">
      <div class="tool-row">
        <button class="btn-locate" id="btnLocate">定位當前任務</button>
        <label class="auto"><input type="checkbox" id="autoFollow"> 自動跟隨</label>
      </div>
      <label class="sim"><input type="checkbox" id="simToggle"> 模擬時間</label>
      <div id="simPanel" hidden>
        <input type="range" id="simRange" min="480" max="1200" step="1" value="575">
        <div class="sim-btns">
          <button data-d="-60">-1h</button><button data-d="-10">-10m</button>
          <button data-d="10">+10m</button><button data-d="60">+1h</button>
          <button id="simNow">回到真實時間</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 統計 -->
  <section class="stats">
    <div class="stat reveal" style="--sc:#3b82f6"><small>值勤總時數</small><span class="num" data-val="12">0</span><span class="unit">小時</span><div class="note">0800 – 2000</div></div>
    <div class="stat reveal" style="--sc:#8b5cf6"><small>崗位當值</small><span class="num" data-val="9.5">0</span><span class="unit">小時</span><div class="note">崗位 2・3・5</div></div>
    <div class="stat reveal" style="--sc:#10b981"><small>巡邏任務</small><span class="num" data-val="2">0</span><span class="unit">次</span><div class="note">路線 D・路線 A</div></div>
    <div class="stat reveal" style="--sc:#f59e0b"><small>用餐休息</small><span class="num" data-val="1">0</span><span class="unit">小時</span><div class="note">1300 – 1400</div></div>
  </section>

  <!-- 甘特圖 -->
  <section class="card sec reveal">
    <h2>全日甘特圖</h2>
    <div class="gantt-wrap">
      <div class="gantt" id="ganttBox"></div>
      <div class="scale" id="scaleBox"></div>
    </div>
    <div class="legend" id="legendBox"></div>
  </section>

  <!-- 詳細時間軸 -->
  <section class="card sec reveal">
    <h2>詳細時間軸</h2>
    <ol class="tl" id="tlBox"></ol>
  </section>

  <footer>整理自當日值勤表 ・ Lucas（0800–2000）</footer>
</div>

<div class="toast" id="toast"><span class="tdot"></span><span id="toastTxt"></span></div>

<script>
  var TYPES = {
    patrol:{ label:"巡邏任務",                 soft:"var(--patrol-soft)", hex:"#10b981" },
    p2:    { label:"崗位 2・地下停車場閘口",     soft:"var(--p2-soft)",     hex:"#3b82f6" },
    p3:    { label:"崗位 3・地下貨用升降機登記處", soft:"var(--p3-soft)",    hex:"#8b5cf6" },
    p5:    { label:"崗位 5・迎賓區車流管制",     soft:"var(--p5-soft)",     hex:"#06b6d4" },
    meal:  { label:"崗位 4・用膳",              soft:"var(--meal-soft)",   hex:"#f59e0b" }
  };
  var SCHEDULE = [
    { s:"08:00", e:"08:30", code:"D", name:"巡邏路線 D",           type:"patrol" },
    { s:"08:30", e:"09:30", code:"2", name:"地下停車場閘口",        type:"p2" },
    { s:"09:30", e:"10:00", code:"5", name:"迎賓區車流管制",        type:"p5" },
    { s:"10:00", e:"11:00", code:"2", name:"地下停車場閘口",        type:"p2" },
    { s:"11:00", e:"12:00", code:"3", name:"地下貨用升降機登記處",   type:"p3" },
    { s:"12:00", e:"13:00", code:"2", name:"地下停車場閘口",        type:"p2" },
    { s:"13:00", e:"14:00", code:"4", name:"用膳",                 type:"meal" },
    { s:"14:00", e:"15:00", code:"2", name:"地下停車場閘口",        type:"p2" },
    { s:"15:00", e:"16:00", code:"3", name:"地下貨用升降機登記處",   type:"p3" },
    { s:"16:00", e:"17:00", code:"5", name:"迎賓區車流管制",        type:"p5" },
    { s:"17:00", e:"18:00", code:"A", name:"巡邏路線 A",           type:"patrol" },
    { s:"18:00", e:"19:00", code:"2", name:"地下停車場閘口",        type:"p2" },
    { s:"19:00", e:"20:00", code:"3", name:"地下貨用升降機登記處",   type:"p3" }
  ];

  /* ---------- 工具 ---------- */
  function toMin(t){ var p = t.split(":"); return (+p[0]) * 60 + (+p[1]); }
  function rgba(hex, a){
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function fmtHM(m){ return pad(Math.floor(m / 60)) + ":" + pad(Math.floor(m % 60)); }
  function fmtDur(m){
    m = Math.max(0, Math.round(m));
    var h = Math.floor(m / 60), mm = m % 60;
    if (h && mm) return h + " 小時 " + mm + " 分";
    if (h) return h + " 小時";
    return mm + " 分鐘";
  }
  function $(id){ return document.getElementById(id); }

  /* ---------- DOM 參照 ---------- */
  var ganttBox = $("ganttBox"), tlBox = $("tlBox"),
      clockTxt = $("clockTxt"), clockTag = $("clockTag"), statusPill = $("statusPill"),
      spFill = $("spFill"), spTxt = $("spTxt"),
      nowCard = $("nowCard"), nowLabel = $("nowLabel"), nowTitle = $("nowTitle"),
      nowRange = $("nowRange"), nowNext = $("nowNext"),
      ringFg = $("ringFg"), ringMin = $("ringMin"),
      toast = $("toast"), toastTxt = $("toastTxt"),
      simToggle = $("simToggle"), simPanel = $("simPanel"), simRange = $("simRange"),
      autoFollow = $("autoFollow");
  var RING_C = 2 * Math.PI * 26;

  /* ---------- 建立甘特圖 ---------- */
  SCHEDULE.forEach(function(row, idx){
    var el = document.createElement("div");
    el.className = "seg";
    el.dataset.type = row.type;
    el.dataset.idx = idx;
    el.style.gridColumn = ((toMin(row.s) - 480) / 30 + 1) + " / span " + ((toMin(row.e) - toMin(row.s)) / 30);
    el.style.background = "linear-gradient(140deg," + TYPES[row.type].hex + "," + TYPES[row.type].hex + "cc)";
    el.style.setProperty("--d", (idx * 0.05) + "s");
    el.style.setProperty("--glow", rgba(TYPES[row.type].hex, .45));
    el.innerHTML = row.code + '<span class="tip">' + row.s + " – " + row.e + "・" + row.name + "</span>";
    el.addEventListener("click", function(){ locate(idx, true); });
    ganttBox.appendChild(el);
  });
  var nowLine = document.createElement("div");
  nowLine.className = "now-line";
  nowLine.innerHTML = "<i></i>";
  nowLine.style.display = "none";
  ganttBox.appendChild(nowLine);
  var nowLineLabel = nowLine.querySelector("i");

  [8,10,12,14,16,18,20].forEach(function(h){
    var tick = document.createElement("i");
    tick.style.left = ((h - 8) / 12 * 100) + "%";
    tick.textContent = pad(h) + ":00";
    $("scaleBox").appendChild(tick);
  });

  /* ---------- 圖例篩選 ---------- */
  var legendBox = $("legendBox"), activeFilter = null;
  Object.keys(TYPES).forEach(function(key){
    var item = document.createElement("span");
    item.className = "lg";
    item.innerHTML = '<span class="dotc" style="background:' + TYPES[key].hex + '"></span>' + TYPES[key].label;
    item.addEventListener("click", function(){
      activeFilter = (activeFilter === key) ? null : key;
      ganttBox.classList.toggle("filtered", !!activeFilter);
      ganttBox.querySelectorAll(".seg").forEach(function(sg){
        sg.classList.toggle("on", sg.dataset.type === activeFilter);
      });
      legendBox.querySelectorAll(".lg").forEach(function(lg){ lg.classList.remove("active"); });
      if (activeFilter) item.classList.add("active");
    });
    legendBox.appendChild(item);
  });

  /* ---------- 時間軸 ---------- */
  SCHEDULE.forEach(function(row, idx){
    var li = document.createElement("li");
    li.className = "t-item reveal";
    li.id = "t-item-" + idx;
    li.style.setProperty("--c", TYPES[row.type].hex);
    li.style.setProperty("--cs", TYPES[row.type].soft);
    li.style.transitionDelay = (idx * 0.04) + "s";
    li.innerHTML =
      '<div class="t-time"><div class="st">' + row.s + '</div><div class="en">– ' + row.e + '</div></div>' +
      '<div class="t-rail"></div>' +
      '<div class="t-body">' +
        '<span class="code">' + row.code + '</span>' +
        '<span class="t-name">' + row.name + '<span class="t-tag">' + TYPES[row.type].label + '</span></span>' +
        '<span class="dur">' + fmtDur(toMin(row.e) - toMin(row.s)) + '</span>' +
        '<span class="state">待執行</span>' +
      '</div>';
    tlBox.appendChild(li);
  });
  var segEls = ganttBox.querySelectorAll(".seg"), itemEls = tlBox.querySelectorAll(".t-item");

  function locate(idx, flash){
    var target = $("t-item-" + idx);
    if (!target) return;
    target.scrollIntoView({ behavior:"smooth", block:"center" });
    if (flash){
      var body = target.querySelector(".t-body");
      body.classList.remove("flash"); void body.offsetWidth; body.classList.add("flash");
    }
  }
  $("btnLocate").addEventListener("click", function(){ if (liveIdx > -1) locate(liveIdx, true); });

  /* ---------- 主題切換 ---------- */
  var sunSVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var moonSVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function applyTheme(t){
    document.body.dataset.theme = t;
    $("btnTheme").innerHTML = (t === "dark") ? sunSVG : moonSVG;
  }
  applyTheme(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  $("btnTheme").addEventListener("click", function(){
    applyTheme(document.body.dataset.theme === "dark" ? "light" : "dark");
  });

  /* ---------- 時間核心 ---------- */
  var simOn = false, simMin = 575, liveIdx = -1, prevLive = null, lastMin = -1, toastTimer = null;

  function realMinutes(){
    var d = new Date();
    return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  }
  function currentMinutes(){ return simOn ? simMin : realMinutes(); }

  function showToast(hex, msg){
    toast.querySelector(".tdot").style.background = hex;
    toastTxt.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 4200);
  }

  simToggle.addEventListener("change", function(){
    simOn = simToggle.checked;
    simPanel.hidden = !simOn;
    clockTag.hidden = !simOn;
    if (simOn){
      simMin = Math.min(1200, Math.max(480, Math.floor(realMinutes())));
      simRange.value = simMin;
    }
    lastMin = -1; tick();
  });
  simRange.addEventListener("input", function(){ simMin = +simRange.value; lastMin = -1; tick(); });
  simPanel.querySelectorAll("button[data-d]").forEach(function(btn){
    btn.addEventListener("click", function(){
      simMin = Math.min(1200, Math.max(480, simMin + (+btn.dataset.d)));
      simRange.value = simMin; lastMin = -1; tick();
    });
  });
  $("simNow").addEventListener("click", function(){
    simToggle.checked = false;
    simToggle.dispatchEvent(new Event("change"));
  });
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden){ lastMin = -1; tick(); }
  });

  function tick(){
    var m = currentMinutes();

    /* 時鐘（每秒） */
    if (simOn){ clockTxt.textContent = fmtHM(simMin); }
    else {
      var d = new Date();
      clockTxt.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }

    /* 現在線（每秒平滑移動） */
    if (m >= 480 && m <= 1200){
      var pct = (m - 480) / 720 * 100;
      nowLine.style.display = "block";
      nowLine.style.left = pct + "%";
      nowLineLabel.textContent = fmtHM(m);
      if (pct < 5){ nowLineLabel.style.left = "0"; nowLineLabel.style.transform = "none"; }
      else if (pct > 95){ nowLineLabel.style.left = "auto"; nowLineLabel.style.right = "0"; nowLineLabel.style.transform = "none"; }
      else { nowLineLabel.style.left = "50%"; nowLineLabel.style.right = "auto"; nowLineLabel.style.transform = "translateX(-50%)"; }
    } else { nowLine.style.display = "none"; }

    /* 更進度（每秒） */
    var sp = Math.min(1, Math.max(0, (m - 480) / 720));
    spFill.style.width = (sp * 100).toFixed(1) + "%";
    spTxt.textContent = "更進度 " + Math.round(sp * 100) + "%";

    /* 分鐘級別才重算狀態（效能優化） */
    var mi = Math.floor(m);
    if (mi !== lastMin){ lastMin = mi; renderState(m); }
    else { updateRing(m); }
  }

  function updateRing(m){
    if (liveIdx > -1){
      var row = SCHEDULE[liveIdx];
      var ratio = (m - toMin(row.s)) / (toMin(row.e) - toMin(row.s));
      ringFg.style.strokeDashoffset = (RING_C * (1 - Math.min(1, Math.max(0, ratio)))).toFixed(1);
      ringFg.style.stroke = TYPES[row.type].hex;
      ringMin.textContent = Math.max(0, Math.ceil(toMin(row.e) - m));
    } else {
      ringFg.style.strokeDashoffset = RING_C;
      ringMin.textContent = "–";
    }
  }

  function renderState(m){
    var idx = -1;
    for (var i = 0; i < SCHEDULE.length; i++){
      if (m >= toMin(SCHEDULE[i].s) && m < toMin(SCHEDULE[i].e)){ idx = i; break; }
    }
    liveIdx = idx;

    SCHEDULE.forEach(function(row, k){
      var st = (k === idx) ? "live" : (toMin(row.e) <= m ? "past" : "future");
      segEls[k].classList.toggle("live", st === "live");
      segEls[k].classList.toggle("past", st === "past");
      itemEls[k].classList.remove("past","live","future");
      itemEls[k].classList.add(st);
      itemEls[k].querySelector(".state").textContent =
        (st === "live") ? "進行中" : (st === "past" ? "已完成" : "待執行");
    });

    if (idx > -1){
      var row = SCHEDULE[idx], hex = TYPES[row.type].hex;
      nowCard.style.setProperty("--nc", hex);
      nowCard.style.setProperty("--ncs", rgba(hex, .4));
      nowLabel.textContent = "當前任務";
      nowTitle.textContent = row.code + "・" + row.name;
      nowRange.textContent = row.s + " – " + row.e;
      nowNext.textContent = SCHEDULE[idx + 1]
        ? "下一任務：" + SCHEDULE[idx + 1].s + " " + SCHEDULE[idx + 1].name
        : "下一任務：20:00 值勤結束";
      statusPill.className = "pill on";
      statusPill.textContent = "值勤中";
      document.title = "【" + row.code + " " + row.name + "】Lucas 值勤表";
    } else if (m < 480){
      nowCard.style.setProperty("--nc", "#3b82f6");
      nowCard.style.setProperty("--ncs", "rgba(59,130,246,.35)");
      nowLabel.textContent = "尚未開更";
      nowTitle.textContent = "08:00 開始值勤";
      nowRange.textContent = "";
      nowNext.textContent = "首項任務：巡邏路線 D・還有 " + fmtDur(480 - m);
      statusPill.className = "pill wait";
      statusPill.textContent = "未開更";
      document.title = "Lucas · 當日工作時間表";
    } else {
      nowCard.style.setProperty("--nc", "#94a3b8");
      nowCard.style.setProperty("--ncs", "rgba(148,163,184,.35)");
      nowLabel.textContent = "已收更";
      nowTitle.textContent = "是日值勤結束";
      nowRange.textContent = "20:00";
      nowNext.textContent = "辛苦了！";
      statusPill.className = "pill off";
      statusPill.textContent = "已收更";
      document.title = "Lucas · 當日工作時間表";
    }
    updateRing(m);

    /* 任務切換通知（僅真實時間） */
    if (prevLive !== null && prevLive !== idx && idx > -1 && !simOn){
      showToast(TYPES[SCHEDULE[idx].type].hex,
        "任務更新 → " + SCHEDULE[idx].code + " " + SCHEDULE[idx].name + "（" + SCHEDULE[idx].s + "–" + SCHEDULE[idx].e + "）");
      if (autoFollow.checked) locate(idx, false);
    }
    prevLive = idx;
  }

  tick();
  setInterval(tick, 1000);

  /* ---------- 進場動畫 ---------- */
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
    });
  }, { threshold:.12 });
  document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });

  /* ---------- 數字跳動 ---------- */
  document.querySelectorAll(".num").forEach(function(numEl){
    var target = parseFloat(numEl.dataset.val);
    var hasDec = numEl.dataset.val.indexOf(".") > -1;
    var t0 = null;
    function step(ts){
      if (!t0) t0 = ts;
      var prog = Math.min((ts - t0) / 900, 1);
      var eased = 1 - Math.pow(1 - prog, 3);
      numEl.textContent = (target * eased).toFixed(hasDec ? 1 : 0);
      if (prog < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
</script>
</body>
</html>
